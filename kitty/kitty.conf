# ╭──────────────────────────────────────────────╮
# │   kitty · anime minimal setup                │
# │   สร้างให้ wakaze — ใช้กับ Claude Code CLI     │
# ╰──────────────────────────────────────────────╯

include theme.conf

# ─── ฟอนต์ ────────────────────────────────────────
font_family      family="Cascadia Code NF" style=Regular
bold_font        family="Cascadia Code NF" style=Bold
italic_font      family="Cascadia Code NF" style=Italic
bold_italic_font family="Cascadia Code NF" style="Bold Italic"
font_size 13.0

# ภาษาไทย — ใช้ Noto Sans Thai แทน (Cascadia ไม่มีอักษรไทย)
symbol_map U+0E00-U+0E7F Noto Sans Thai

# ระยะห่างบรรทัด ให้อ่านสบายตา
modify_font cell_height 118%
disable_ligatures never

# ─── หน้าต่าง · minimal ───────────────────────────
hide_window_decorations yes
window_padding_width 16 18
window_margin_width 0
background_opacity 0.92
dynamic_background_opacity yes
background_blur 48
placement_strategy center
remember_window_size yes
initial_window_width  120c
initial_window_height 34c
confirm_os_window_close 0

# ─── เคอร์เซอร์ · มีหางลากตาม ✨ ────────────────────
cursor_shape beam
cursor_beam_thickness 1.8
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval 0.6
cursor_stop_blinking_after 8.0

# ─── แท็บ · โผล่เมื่อมีมากกว่า 1 ────────────────────
tab_bar_edge top
tab_bar_style slant
tab_bar_min_tabs 2
tab_bar_margin_height 8 0
tab_title_template "{index}  {title}"

# ─── scrollback / เมาส์ ───────────────────────────
scrollback_lines 20000
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
detect_urls yes

# ─── เงียบ ๆ ไม่มีเสียงเตือน ───────────────────────
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no

# ─── Wayland / GNOME ──────────────────────────────
linux_display_server wayland
wayland_titlebar_color background

# ╭──────────────────────────────────────────────╮
# │  ปุ่มลัด                                       │
# ╰──────────────────────────────────────────────╯

# ★ สำคัญสำหรับ Claude Code — ขึ้นบรรทัดใหม่โดยไม่ส่งข้อความ
map shift+enter send_text all \x1b\r
map ctrl+enter  send_text all \x1b\r

# คัดลอก / วาง แบบที่คุ้นเคย
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# แท็บ
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4

# แบ่งจอ
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# ขนาดตัวอักษร
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# ปรับความโปร่งใสสด ๆ
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default
